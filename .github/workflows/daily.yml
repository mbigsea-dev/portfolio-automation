name: Daily Portfolio Report

on:
  schedule:
    # 한국시간 07:00 = UTC 22:00 (전날)
    - cron: '0 22 * * *'
  workflow_dispatch: {}  # 수동 실행 버튼도 사용 가능

permissions:
  contents: write  # peak_profit_record.json 자동 커밋을 위해 필요

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run portfolio automation
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_HOLDINGS_DATABASE_ID: ${{ secrets.NOTION_HOLDINGS_DATABASE_ID }}
          NOTION_CASH_PAGE_ID: ${{ secrets.NOTION_CASH_PAGE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python portfolio_automation.py

      - name: Commit updated peak profit record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add peak_profit_record.json
          git diff --staged --quiet || git commit -m "Update peak profit record [skip ci]"
          git push
